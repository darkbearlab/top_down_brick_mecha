<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Brick Mecha</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="help">
    <b>試玩場</b>
    WASD 移動・滑鼠瞄準・左鍵 / 右鍵 開火・Q / E 切換左右背部武器・Space / Shift 推進衝刺<br>
    G 整備（組裝機體）・R 修復機體・T 敵機停火 / 開火・Esc 暫停<br>
    手把：左右搖桿、LT / RT 左右開火、LB / RB 切換左右背部武器、A 衝刺、Back 整備
  </div>
  <div id="status">
    <div class="doll" id="dollP"><div class="row"><div data-p="backL"></div><div data-p="head" class="head"></div><div data-p="backR"></div></div><div class="row"><div data-p="armL" class="arm"></div><div data-p="torso" class="torso"></div><div data-p="armR" class="arm"></div></div><div data-p="legs" class="legs"></div></div>
    <div class="col">
      <div id="guns"></div>
      <div class="bar"><div id="energy"></div></div>
      <div class="move"><span id="surf"></span>　速度 <b id="speed"></b>　<span id="lockInfo"></span></div>
      <div id="warn"></div>
    </div>
  </div>
  <div id="target" class="hidden">
    <div class="label" id="tName">目標</div>
    <div class="doll" id="dollE"><div class="row"><div data-p="backR"></div><div data-p="head" class="head"></div><div data-p="backL"></div></div><div class="row"><div data-p="armR" class="arm"></div><div data-p="torso" class="torso"></div><div data-p="armL" class="arm"></div></div><div data-p="legs" class="legs"></div></div>
  </div>
  <div id="passive" class="hidden">敵機停火中（T）</div>
  <canvas id="minimap" class="hidden"></canvas>
  <div id="endless" class="hidden"><div id="enTime">0:00</div><div id="enInfo"></div><div id="enMods" class="wguns"></div></div>
</div>
<div id="watch" class="hidden">
  <div class="wtop"><div id="wRound"></div><div id="wScore"></div><div id="wNext"></div></div>
  <div class="wside blue"><div class="doll" id="dollB"><div class="row"><div data-p="backL"></div><div data-p="head" class="head"></div><div data-p="backR"></div></div><div class="row"><div data-p="armL" class="arm"></div><div data-p="torso" class="torso"></div><div data-p="armR" class="arm"></div></div><div data-p="legs" class="legs"></div></div><div><b id="wBName"></b><div id="wBGuns" class="wguns"></div></div></div>
  <div class="wside red"><div><b id="wRName"></b><div id="wRGuns" class="wguns"></div></div><div class="doll" id="dollR"><div class="row"><div data-p="backL"></div><div data-p="head" class="head"></div><div data-p="backR"></div></div><div class="row"><div data-p="armL" class="arm"></div><div data-p="torso" class="torso"></div><div data-p="armR" class="arm"></div></div><div data-p="legs" class="legs"></div></div></div>
  <div class="whint">Esc 暫停 / 下一場 / 回主選單</div>
</div>
<div id="toast"></div>
<div id="menu" class="hidden">
  <div class="mpanel">
    <h1>BRICK<span>MECHA</span></h1>
    <p class="sub">俯視角方塊機甲・組裝・捉對廝殺</p>
    <button class="btn primary" id="mDuel">對戰<small>一對一・選對手和難度</small></button>
    <button class="btn" id="mExplore">探索（大地圖測試）<small>256 × 192 的大地圖，岩壁隔出 12 個區域・清掉各區域駐守的小隊</small></button>
    <button class="btn" id="mEndless">無盡模式<small>雜魚越來越多、越來越強・撿掉落的彈藥、修理和強化模組・撐越久越好</small></button>
    <button class="btn" id="mWatch">觀戰<small>電腦對電腦・隨機配裝・打完自動換下一場</small></button>
    <button class="btn" id="mHorde">觀戰：王牌 vs 雜魚<small>一台王牌機對上一批批空投的雜魚機（共 18 台）</small></button>
    <button class="btn" id="mSkirmish">觀戰：雜魚 vs 雜魚<small>藍紅兩隊雜魚各 12 台，從兩側空投，先全滅的輸</small></button>
    <button class="btn" id="mSandbox">試玩場<small>練習用・敵機一開始停火（T 切換）</small></button>
    <button class="btn" id="mGarage">整備<small>組裝機體：頭、軀幹、腳、四個武器、裝甲</small></button>
    <button class="btn" id="mHelp">操作說明<small>鍵盤滑鼠 / 手把・屬性剋制・部位</small></button>
  </div>
</div>
<div id="duel" class="hidden">
  <div class="mpanel wide">
    <h2>選擇對手</h2>
    <div id="dCards"></div>
    <h2>難度</h2>
    <div id="dDiff"></div>
    <div class="row"><button class="btn" id="dBack">返回</button><button class="btn primary" id="dStart">開始對戰</button></div>
  </div>
</div>
<div id="panel" class="hidden"><div class="pbox"><h2 id="pTitle"></h2><div id="pBody"></div><div id="pButtons"></div></div></div>
<div id="garage" class="hidden">
  <div class="gpanel">
    <div class="ghead"><b>整備</b><span>改了馬上套用到機體・外框顏色 = 裝甲種類</span><button id="gClose">出擊（G）</button></div>
    <div class="gbody"><div id="gCats"></div><div id="gOpts"></div><div id="gStats"></div></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
